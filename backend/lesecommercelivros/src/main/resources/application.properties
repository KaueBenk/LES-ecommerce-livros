spring.application.name=lesecommercelivros

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/les_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:les_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:les_password}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Security / JWT
jwt.secret=4f59339e830e386da61d76371ef396fae85290b22a00c1e8d6df022eb185984f59339e830e386da61d76371ef396fae85290b22a00c1e8d6df022eb18598
jwt.expiration=86400000

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-mock-key}

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# SQL Init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
