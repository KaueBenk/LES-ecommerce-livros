spring.application.name=lesecommercelivros

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/les_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:les_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:les_password}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=true

# Detailed Hibernate Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=INFO
logging.level.org.hibernate.engine.spi.ActionQueue=INFO
logging.level.org.hibernate.stat=INFO
spring.jpa.properties.hibernate.generate_statistics=false

# Security / JWT
jwt.secret=4f59339e830e386da61d76371ef396fae85290b22a00c1e8d6df022eb185984f59339e830e386da61d76371ef396fae85290b22a00c1e8d6df022eb18598
jwt.expiration=86400000

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-mock-key}
spring.ai.openai.chat.options.model=gpt-5.4-mini

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# SQL Init
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true
