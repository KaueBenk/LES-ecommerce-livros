version: '3.8'

services:
  # Frontend — development mode with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: les-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - les-network
    restart: unless-stopped

  # Frontend — production build served by nginx
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: les-frontend-prod
    ports:
      - "80:80"
    networks:
      - les-network
    restart: unless-stopped
    profiles:
      - production

networks:
  les-network:
    driver: bridge
