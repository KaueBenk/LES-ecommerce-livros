services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: les-db
    environment:
      POSTGRES_DB: les_db
      POSTGRES_USER: les_user
      POSTGRES_PASSWORD: les_password
    ports:
      - "5432:5432"
    networks:
      - les-network
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U les_user -d les_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Backend
  backend:
    build:
      context: ./backend/lesecommercelivros
      dockerfile: Dockerfile
    container_name: les-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/les_db
      - SPRING_DATASOURCE_USERNAME=les_user
      - SPRING_DATASOURCE_PASSWORD=les_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_CONTINUE_ON_ERROR=true
      # Garante logs visíveis no console do Docker
      - LOGGING_LEVEL_COM_KAUEBENK_LESECOMMERCELIVROS=INFO
      - SPRING_OUTPUT_ANSI_ENABLED=ALWAYS
    depends_on:
      db:
        condition: service_healthy
    networks:
      - les-network
    restart: unless-stopped

  # Frontend — development mode with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: les-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    networks:
      - les-network
    restart: unless-stopped
    profiles:
      - dev

  # Frontend — production build served by nginx
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: les-frontend-prod
    ports:
      - "80:80"
    networks:
      - les-network
    restart: unless-stopped
    profiles:
      - production

networks:
  les-network:
    driver: bridge

volumes:
  db-data:
